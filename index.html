<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday! 🎂</title>
<style>
  :root {
    --bg: #FFF0F5;
    --dark-pink: #D6336C;
    --pink: #F8A5C2;
    --text: #5A2A3A;
    --soft-text: #A07888;
    --paper: #FFFDF8;
    --shadow: #EBCAD7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .page {
    display: none;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 800px;
    margin: 0 auto;
    padding: 28px 16px 24px;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .page.active { display: flex; }

  h1 {
    color: var(--dark-pink);
    font-size: clamp(30px, 7vw, 44px);
    margin: 8px 0 0;
    opacity: 0;
    transform: translateY(-30px);
    animation: dropIn .8s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes dropIn { to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(110vh); } to { opacity: 1; transform: none; } }

  #scene { width: 100%; max-width: 640px; aspect-ratio: 640 / 300; display: block; }

  .message { min-height: 120px; margin-top: 8px; max-width: 520px; }
  .label {
    color: var(--dark-pink); font-weight: bold; font-size: 18px;
    margin-bottom: 8px; min-height: 22px;
  }
  .label.show { animation: fadeUp .3s ease-out; }
  .typed { font-size: clamp(19px, 4.5vw, 23px); line-height: 1.45; }

  .buttons {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 22px;
    margin-top: 14px;
  }
  .buttons.hidden { visibility: hidden; }
  .buttons.appear { animation: fadeUp .6s ease-out; }
  button {
    font: bold 19px Arial, Helvetica, sans-serif;
    width: 250px; height: 56px;
    border: none; border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--shadow);
    transition: transform .12s ease, box-shadow .12s ease, background .15s;
  }
  button.primary { background: var(--dark-pink); color: #fff; }
  button.secondary { background: #fff; color: var(--dark-pink); }
  button:hover { transform: translateY(-3px); box-shadow: 0 8px 0 var(--shadow); }
  button.primary:hover { background: #C42E62; }
  button.secondary:hover { background: #FEE6EF; }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--shadow); }
  button.small { width: 170px; height: 50px; font-size: 17px; }

  .counter { margin-top: 18px; color: var(--soft-text); font-style: italic; font-size: 15px; min-height: 18px; }

  /* Letter */
  #letterPage h2 { color: var(--dark-pink); font-size: clamp(28px, 6vw, 36px); margin: 4px 0 18px; animation: fadeUp .6s ease-out; }
  .paper {
    background: var(--paper);
    width: 100%; max-width: 620px;
    border-radius: 20px;
    box-shadow: 7px 7px 0 var(--shadow);
    padding: 30px 30px 44px;
    text-align: left;
    font-size: clamp(18px, 4.2vw, 20px);
    line-height: 1.7;
    white-space: pre-wrap;
    position: relative;
    min-height: 300px;
    cursor: pointer;
    animation: slideUp .8s cubic-bezier(.2,.8,.3,1);
  }
  .paper .hearts { position: absolute; right: 20px; bottom: 12px; color: var(--pink); font-size: 26px; letter-spacing: -6px; }
  .paper .hearts small { font-size: 16px; opacity: .6; }
  #letterPage .buttons { margin: 26px 0 8px; }

  /* Wider paper on laptops and big screens */
  #letterPage { max-width: 1000px; }
  @media (min-width: 900px) {
    .paper { max-width: 780px; padding: 40px 52px 52px; }
  }

  /* Birthday stickers on both sides of the letter (only when there's room) */
  .stickers { display: none; }
  @media (min-width: 1150px) {
    #letterPage.active ~ .stickers { display: block; }
  }
  .side { position: fixed; top: 0; bottom: 0; width: calc(50% - 400px); z-index: 0; pointer-events: none; }
  .side.left { left: 0; }
  .side.right { right: 0; }
  .sticker {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    animation: stickerIn .7s ease-out forwards, float 4s ease-in-out infinite;
  }
  .sticker svg { display: block; width: 100%; height: auto; }
  @keyframes stickerIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes float {
    0%, 100% { translate: 0 0; rotate: var(--tilt, 0deg); }
    50% { translate: 0 -12px; rotate: calc(var(--tilt, 0deg) + 3deg); }
  }

  /* Finale */
  .line1 { font-size: clamp(24px, 5.5vw, 30px); margin-top: 20px; min-height: 36px; }
  #bigHeart { width: 300px; max-width: 80vw; aspect-ratio: 1; display: block; margin: 6px 0; }
  .line2 { font-size: clamp(19px, 4.5vw, 22px); min-height: 30px; }
  .line3 { font-size: clamp(25px, 6vw, 32px); color: var(--dark-pink); font-weight: bold; margin: 12px 0 8px; min-height: 40px; }

  #floaters, #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #floaters { z-index: 0; }
  #confetti { z-index: 5; }
</style>
</head>

<script>
// =====================================================
//  ✏️  THE PARTS YOU EDIT
// =====================================================

const hisName = "Dani";     // his name or nickname
const yourName = "Nana";      // how you sign the letter

// Specific memories work best!
const reasons = [
  "Kamu membuat saya rasa dihargai",
  "I like to see you berusaha untuk mencapai impian kamu ",
  "Sebab kamu selalu buat saya ketawa tanpa perlu mencuba ",
  "I love how I can be myself around you ",
  "Sebab kehadiran kamu membawa ketenangan",
  "You are hardworking",
  "Kamu sangat penyabar",
  "You're my favourite person to do nothing with",
  "I love how talking to you can make my day better",
  "Sebab saya suka dengar cerita kamu, walaupun benda kecil",
  "Sebab saya sentiasa ada something to learn from you",
  "Sebab saya suka cara kamu berfikir",
  "You make me feel safe to be myself",
  "Kamu jarang marah",
  "Sebab walaupun kita jauh, kamu tetap dekat di hati",
  "Sebab kamu ada cara tersendiri untuk melihat sesuatu perkara",
  "Masih banyak tentang diri kamu yang saya ingin kenali",
  "You are funny",
  "My favourite bestie <3",
  "Sebab saya dapat menyaksikan perjalanan hidup kamu",
  "Saya suka melihat sisi diri kamu yang jarang ditunjukkan kepada orang lain",
  "Kamu kuatt",
  "Sebab saya selalu tersenyum bila kamu senyum",
  "Sebab saya bersyukur takdir menemukan saya dengan seseorang seperti kamu"
];

// Your letter goes between the two backticks ` `
// Press Enter twice for a new paragraph.
const letter = `Happy birthday sayang!

Untuk ulang tahun kamu yang ke-24, saya memberi kamu 24 reasons you are special to me and sebab saya sayang kamu ♥ Ada banyak perkara tentang diri kamu yang saya hargai including the small things yang kamu mungkin tidak sadar. 

Whatever this new chapter of your life brings, I hope you will always continue chasing your dreams and work towards everything that you want. I hope life will always be kind to you and that you will always find reasons to be proud of yourself, just as I am proud to have you in my life. 

Semoga tahun ini dan tahun" yang akan datang hidup kamu penuh dengan ketenangan, barakah dan segala perkara baik yang kamu impikan.

Jangan pernah lupa kamu juga layak menerima kebahagiaan, kasih sayang dan segala kebaikan yang kamu berikan kepada orang lain. Thank you for being patient with me, making me laugh and for being my favourite person. 

May Allah always protect you, guide you towards what is best for you and grant you success in this life and the hereafter! aminnn kaya bareng ♥

Here's to many more birthdays together.`;

// =====================================================
//  Everything below makes it work
// =====================================================

const COLOURS = { darkPink: "#D6336C", pink: "#F8A5C2", cream: "#FFE5B4", brown: "#8B5A2B", plate: "#DDDDDD" };
const CONFETTI = ["#D6336C", "#F8A5C2", "#FFD166", "#06D6A0", "#74C0FC", "#B197FC"];

const $ = id => document.getElementById(id);
const easeOut = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const easeOutBack = t => { t = Math.min(1, Math.max(0, t)); return 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2); };

// Shuffle the reasons so they come in a random order with no repeats
function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
}
shuffle(reasons);

let reasonNumber = 0;
let cameFrom = "home";
let letterTyped = false;
let homeStart = performance.now();

// ---------------- Canvas helpers ----------------
function setupCanvas(canvas, width, height) {
  // Makes canvas drawings sharp on phones and retina screens
  const ratio = window.devicePixelRatio || 1;
  const cssWidth = canvas.clientWidth || width;
  const scale = cssWidth / width;
  canvas.width = Math.round(cssWidth * ratio);
  canvas.height = Math.round(height * scale * ratio);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(ratio * scale, 0, 0, ratio * scale, 0, 0);
  return ctx;
}

function heart(ctx, cx, cy, width, colour) {
  // Same heart shape as the Python version, centred on (cx, cy)
  if (width < 2) return;
  const r = width / 3.736;
  const rad = d => d * Math.PI / 180;
  const tipX = cx, tipY = cy + 1.517 * r;        // canvas y goes downwards
  const L = 1.972 * r;
  const px = tipX + L * Math.cos(rad(140)), py = tipY - L * Math.sin(rad(140));
  const c1x = px + r * Math.cos(rad(50)), c1y = py - r * Math.sin(rad(50));
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(px, py);
  ctx.arc(c1x, c1y, r, rad(-230), rad(-30));     // left bump
  ctx.arc(2 * cx - c1x, c1y, r, rad(-150), rad(50)); // right bump
  ctx.lineTo(tipX, tipY);
  ctx.fillStyle = colour;
  ctx.fill();
}

// ---------------- Home scene: cake + floating hearts ----------------
const scene = $("scene");
let sceneCtx = setupCanvas(scene, 640, 300);

function drawScene(now) {
  const t = (now - homeStart) / 1000;
  const ctx = sceneCtx;
  ctx.clearRect(0, 0, 640, 300);
  // Turtle-style coordinates: (0,0) is the cake's middle, y goes up
  const X = x => 320 + x, Y = y => 255 - y;
  const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(X(x), Y(y + h), w, h); };
  const dot = (x, y, size, c) => { ctx.beginPath(); ctx.arc(X(x), Y(y), Math.max(0.5, size / 2), 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); };

  const heartFade = easeOut((t - 1.2) / 0.6);
  heart(ctx, X(-250), Y(80 + 7 * Math.sin(t * 2)), 74 * heartFade, COLOURS.pink);
  heart(ctx, X(250), Y(80 + 7 * Math.sin(t * 2 + 1.5)), 74 * heartFade, COLOURS.pink);

  const dy = -420 * (1 - easeOut((t - 0.3) / 1.3));   // cake rises up
  ctx.save();
  ctx.translate(0, -dy);
  rect(-170, -20, 340, 12, COLOURS.plate);
  rect(-150, -8, 300, 80, COLOURS.brown);
  rect(-150, 52, 300, 20, COLOURS.cream);
  for (let x = -140; x < 150; x += 28) dot(x, 52, 14, COLOURS.cream);
  rect(-100, 72, 200, 60, COLOURS.pink);
  rect(-100, 117, 200, 15, COLOURS.cream);
  for (let x = -90; x < 100; x += 30) dot(x, 117, 12, COLOURS.cream);
  [-60, -20, 20, 60].forEach((x, i) => {
    rect(x - 5, 132, 10, 40, COLOURS.darkPink);
    const f = Math.sin(t * 11 + i * 2) + Math.sin(t * 17 + i);
    dot(x + f * 0.8, 181 + f, 17 + f * 1.5, "#FF9F1C");
    dot(x + f * 0.5, 183 + f, 8 + f, "#FFE066");
  });
  ctx.restore();
}

// ---------------- Typewriter ----------------
let typingJob = 0;
function typeInto(el, text, speed = 40, delay = 0) {
  // Types text into an element letter by letter. Returns a promise.
  const job = ++typingJob;
  el.textContent = "";
  return new Promise(resolve => {
    const start = performance.now() + delay;
    function step(now) {
      if (job !== typingJob) return resolve();
      const n = Math.max(0, Math.floor((now - start) / 1000 * speed));
      el.textContent = text.slice(0, n);
      if (n < text.length) requestAnimationFrame(step);
      else resolve();
    }
    requestAnimationFrame(step);
  });
}

// ---------------- Confetti ----------------
const confetti = $("confetti");
let confettiCtx, pieces = [];
function sizeOverlays() {
  const ratio = window.devicePixelRatio || 1;
  for (const c of [confetti, $("floaters")]) {
    c.width = innerWidth * ratio;
    c.height = innerHeight * ratio;
    c.getContext("2d").setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  confettiCtx = confetti.getContext("2d");
  sceneCtx = setupCanvas(scene, 640, 300);
  heartCtx = setupCanvas(bigHeart, 300, 300);
}

function burstConfetti(button) {
  const box = button.getBoundingClientRect();
  for (let i = 0; i < 60; i++) {
    pieces.push({
      x: box.left + box.width / 2, y: box.top,
      vx: (Math.random() - 0.5) * 520,
      vy: -(300 + Math.random() * 320),
      size: 6 + Math.random() * 6,
      spin: Math.random() * 6,
      colour: CONFETTI[Math.floor(Math.random() * CONFETTI.length)],
      life: 1.4 + Math.random() * 0.7,
    });
  }
}

function drawConfetti(dt) {
  confettiCtx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of pieces) {
    p.vy += 900 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    p.spin += dt * 8;
    const size = p.size * Math.min(1, p.life * 2);
    if (size < 1) continue;   // the bug we fixed in Python!
    confettiCtx.save();
    confettiCtx.translate(p.x, p.y);
    confettiCtx.rotate(p.spin);
    confettiCtx.fillStyle = p.colour;
    confettiCtx.fillRect(-size / 2, -size / 4, size, size / 2);
    confettiCtx.restore();
  }
  pieces = pieces.filter(p => p.life > 0);
}

// ---------------- Finale: big heart + floating hearts ----------------
const bigHeart = $("bigHeart");
let heartCtx;
let finaleStart = 0, floaters = [];

function drawFinale(now, dt) {
  const t = (now - finaleStart) / 1000;
  heartCtx.clearRect(0, 0, 300, 300);
  const pop = easeOutBack((t - 0.6) / 0.7);
  const beat = 1 + 0.06 * Math.pow(Math.max(0, Math.sin(t * 5)), 8);
  heart(heartCtx, 150, 150, 260 * pop * beat, COLOURS.darkPink);

  const fctx = $("floaters").getContext("2d");
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  if (Math.random() < 0.08) {
    floaters.push({ x: Math.random() * innerWidth, y: innerHeight + 30,
      size: 14 + Math.random() * 18, speed: 40 + Math.random() * 50, phase: Math.random() * 6 });
  }
  for (const f of floaters) {
    f.y -= f.speed * dt;
    heart(fctx, f.x + 12 * Math.sin(t + f.phase), f.y, f.size, "rgba(248,165,194,0.45)");
  }
  floaters = floaters.filter(f => f.y > -40);
}

// ---------------- Pages ----------------
function show(pageId) {
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === pageId));
  window.scrollTo(0, 0);
  sizeOverlays();
}
function currentPage() { return document.querySelector(".page.active").id; }

function startHome() {
  shuffle(reasons);
  reasonNumber = 0;
  homeStart = performance.now();
  $("label").textContent = "";
  $("counter").textContent = "";
  $("reasonBtn").textContent = "Click for a reason ♥";
  $("homeButtons").className = "buttons hidden";
  const title = $("title");
  title.textContent = `Happy Birthday, ${hisName}!`;
  title.style.animation = "none"; title.offsetHeight; title.style.animation = "";
  show("home");
  typeInto($("typed"), `My gift to you <3. Ada ${reasons.length} reasons saya sayang kamu hehe and birthday letter`, 40, 1600);
  setTimeout(() => $("homeButtons").className = "buttons appear", 2000);
}

function nextReason() {
  if (reasonNumber < reasons.length) {
    reasonNumber++;
    const label = $("label");
    label.textContent = `Reason #${reasonNumber}`;
    label.classList.remove("show"); label.offsetHeight; label.classList.add("show");
    typeInto($("typed"), reasons[reasonNumber - 1], 40, 150);
    $("counter").textContent = `${reasonNumber} of ${reasons.length} reasons opened`;
    if (reasonNumber === reasons.length) $("reasonBtn").textContent = "One last thing... ♥";
    burstConfetti($("reasonBtn"));
  } else {
    startFinale();
  }
}

async function startFinale() {
  show("finale");
  finaleStart = performance.now();
  floaters = [];
  $("finaleButtons").className = "buttons hidden";
  ["line1", "line2", "line3"].forEach(id => $(id).textContent = "");
  await typeInto($("line1"), "That's all of them... for now.", 32, 200);
  await typeInto($("line2"), "Actually, I could never fit them all in one window.", 32, 900);
  await typeInto($("line3"), `Happy birthday, ${hisName}. I love you. ♥`, 18, 900);
  setTimeout(() => $("finaleButtons").className = "buttons appear", 600);
}

const fullLetter = `Dear ${hisName},\n\n${letter}\n\nLove,\n${yourName}`;
function openLetter() {
  cameFrom = currentPage();
  show("letterPage");
  if (!letterTyped) {
    letterTyped = true;
    typeInto($("letterText"), fullLetter, 55, 800);
  } else {
    $("letterText").textContent = fullLetter;   // already read once: show it all
  }
}
$("paper").addEventListener("click", () => { typingJob++; $("letterText").textContent = fullLetter; });

$("reasonBtn").addEventListener("click", nextReason);
$("letterBtn").addEventListener("click", openLetter);
$("finaleLetterBtn").addEventListener("click", openLetter);
$("backBtn").addEventListener("click", () => show(cameFrom));
$("againBtn").addEventListener("click", () => { $("floaters").getContext("2d").clearRect(0, 0, innerWidth, innerHeight); startHome(); });
addEventListener("resize", sizeOverlays);

// ---------------- Animation loop (~60 frames a second) ----------------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const page = currentPage();
  if (page === "home") drawScene(now);
  if (page === "finale") drawFinale(now, dt);
  drawConfetti(dt);
}

sizeOverlays();
startHome();
requestAnimationFrame(frame);
</script>
